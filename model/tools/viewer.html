<script type="module">
// Studio-style renderer for the printer GLB: PBR materials per part, image-based lighting,
// key/fill/rim lights with soft shadows, ACES tone mapping, gradient backdrop, shadow-catcher floor.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

const SS = Number(new URLSearchParams(location.search).get('ss') || 2);   // supersampling factor
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(SS); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
// neutral studio backdrop: soft vertical gradient with a faint vignette
{ const c = document.createElement('canvas'); c.width = 512; c.height = 512; const g = c.getContext('2d');
  const v = g.createLinearGradient(0, 0, 0, 512); v.addColorStop(0, '#ffffff'); v.addColorStop(0.5, '#eef0f3'); v.addColorStop(1, '#aeb5c0');
  g.fillStyle = v; g.fillRect(0, 0, 512, 512);
  const rad = g.createRadialGradient(256, 230, 120, 256, 256, 420); rad.addColorStop(0, 'rgba(255,255,255,0.4)'); rad.addColorStop(1, 'rgba(90,100,115,0.3)');
  g.fillStyle = rad; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
const pmrem = new THREE.PMREMGenerator(r);
// image-based lighting: a dim studio (Z up) with a few bright soft boxes, so metals get defined highlights
{ const env = new THREE.Scene();
  const wall = (col) => new THREE.MeshBasicMaterial({ color: new THREE.Color(col, col, col), side: THREE.BackSide });
  env.add(new THREE.Mesh(new THREE.BoxGeometry(40, 40, 24), wall(0.07)));
  const panel = (w, h, pos, look, v) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(v, v, v * 0.98), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(...look); env.add(m); };
  panel(22, 22, [0, 0, 11.5], [0, 0, 0], 1.2);          // overhead soft box
  panel(14, 9, [13, -15, 5], [0, 0, 0], 5.0);           // key soft box, front right
  panel(9, 12, [-19, -6, 3], [0, 0, 0], 1.2);           // fill, left
  panel(18, 3, [-6, 19, 7], [0, 0, 0], 4.0);            // rim strip, back
  panel(40, 40, [0, 0, -11.9], [0, 0, 0], 0.25);        // light floor bounce
  scene.environment = pmrem.fromScene(env, 0.02).texture; }

// lighting rig (printer coords: X right, Y back, Z up; millimetres)
const key = new THREE.DirectionalLight(0xfff4e6, 2.5); key.position.set(700, -900, 1300); key.target.position.set(182, 177, 200);
key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -620, right: 620, top: 620, bottom: -620, near: 200, far: 3200 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 1.2; key.shadow.radius = 3;
const fill = new THREE.DirectionalLight(0xdfeaff, 0.55); fill.position.set(-900, -500, 500); fill.target.position.set(182, 177, 200);
const rim = new THREE.DirectionalLight(0xffffff, 1.1); rim.position.set(-300, 1100, 900); rim.target.position.set(182, 177, 250);
const top = new THREE.DirectionalLight(0xffffff, 0.2); top.position.set(182, 150, 1600); top.target.position.set(182, 177, 0);
const under = new THREE.DirectionalLight(0xffffff, 0.0); under.position.set(250, 100, -900); under.target.position.set(182, 177, 60);
scene.add(key, key.target, fill, fill.target, rim, rim.target, top, top.target, under, under.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ad, 0.18));
// chamber light: stands in for the LED strip so the bed and Z column stay readable inside the enclosure
const chamber = new THREE.PointLight(0xfff8ee, 0.35, 0, 0); chamber.position.set(182, 60, 360); scene.add(chamber);
const chamber2 = new THREE.PointLight(0xffffff, 0.2, 0, 0); chamber2.position.set(182, 300, 330); scene.add(chamber2);

// PBR presets, first match on the part name (or any parent's name) wins
const P = (o) => o;
const PRESETS = [
  [/window/, P({ kind: 'acrylic' })],
  [/bed_glass/, P({ kind: 'glass' })],
  [/toolhead_placeholder/, P({ kind: 'ghost', opacity: 0.2 })],
  [/planned/, P({ kind: 'ghost', opacity: 0.28 })],
  [/chamber_floor/, P({ metalness: 0.1, roughness: 0.7, env: 0.3 })],
  [/enclosure_shell|chamber_floor|cover_hercules/, P({ metalness: 0.15, roughness: 0.5, env: 0.7 })],       // powder-coated steel
  [/top_frame_plate|tray_mounting_plate|bed_heater_plate|bed_support_arms|z_carriage$/, P({ metalness: 0.0, roughness: 0.78, env: 0.22, lift: 0.008 })],                 // black powder coat
  [/end_seals/, P({ metalness: 0.0, roughness: 0.45, env: 0.8 })],
  [/rail|z_rods|lead_screw|bed_centre_screw|bed_clips|carriage/, P({ metalness: 1.0, roughness: 0.28, env: 1.5 })],   // ground steel
  [/x_end_plate|idler|pulley|coupler|encoder_knob|round_connector/, P({ metalness: 0.95, roughness: 0.42, env: 1.5 })], // machined aluminium
  [/standoff/, P({ metalness: 1.0, roughness: 0.3, env: 1.5 })],                                                 // brass
  [/motor/, P({ metalness: 0.3, roughness: 0.55, env: 0.35, lift: 0.012 })],
  [/belts/, P({ metalness: 0.0, roughness: 0.85, env: 0.5 })],
  [/lcd_screen/, P({ metalness: 0.0, roughness: 0.3, env: 0.6, emissive: 0.08 })],
  [/board|fuse/, P({ metalness: 0.0, roughness: 0.6, env: 0.35 })],                                              // PCB / components
  [/harness|lead|ribbon|cable/, P({ metalness: 0.0, roughness: 0.6, env: 0.4, lift: 0.01 })],
  [/.*/, P({ metalness: 0.05, roughness: 0.65, env: 0.4, lift: 0.01 })],
];
function presetFor(o) { const names = []; for (let n = o; n; n = n.parent) if (n.name) names.push(n.name);
  for (const [re, p] of PRESETS) if (names.some(n => re.test(n))) return p; }
function restyle(mesh) {
  const p = presetFor(mesh), c = mesh.material.color.clone();
  let m;
  if (p.kind === 'acrylic') m = new THREE.MeshPhysicalMaterial({ color: 0x5d737b, transparent: true, opacity: 0.3, roughness: 0.04, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.0, side: THREE.DoubleSide, depthWrite: false });
  else if (p.kind === 'glass') m = new THREE.MeshPhysicalMaterial({ color: 0x1b2226, transparent: true, opacity: 0.8, roughness: 0.06, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.05, envMapIntensity: 0.7, depthWrite: false });
  else if (p.kind === 'ghost') m = new THREE.MeshStandardMaterial({ color: c.lerp(new THREE.Color(0.55, 0.55, 0.55), 0.45), transparent: true, opacity: p.opacity, roughness: 0.4, metalness: 0, envMapIntensity: 0.6, side: THREE.DoubleSide, depthWrite: false });
  else { if (p.lift) { c.r = Math.max(c.r, p.lift); c.g = Math.max(c.g, p.lift); c.b = Math.max(c.b, p.lift * 1.1); }
    m = new THREE.MeshStandardMaterial({ color: c, metalness: p.metalness, roughness: p.roughness, envMapIntensity: p.env });
    if (p.emissive) { m.emissive = c.clone(); m.emissiveIntensity = p.emissive; } }
  const solid = !p.kind;
  mesh.castShadow = solid; mesh.receiveShadow = solid; mesh.renderOrder = solid ? 0 : 2; mesh.material = m;
}

const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 60, 6000);
// post: ambient occlusion (opaque parts only) + ACES/sRGB output, multisampled
const composer = new EffectComposer(r);
composer.renderTarget1.samples = 4; composer.renderTarget2.samples = 4;
composer.addPass(new RenderPass(scene, cam));
const ao = new GTAOPass(scene, cam, innerWidth, innerHeight);
ao.updateGtaoMaterial({ radius: 45, distanceExponent: 1.4, thickness: 12, scale: 1.6, samples: 16 });
ao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 8, rings: 2, samples: 16 });
ao.blendIntensity = 0.9;
{ const base = ao.overrideVisibility.bind(ao);
  ao.overrideVisibility = function () { base(); scene.traverse(o => { if (o.isMesh && o.material.transparent) o.visible = false; }); }; }
composer.addPass(ao); composer.addPass(new OutputPass());
const holder = new THREE.Group(); scene.add(holder);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), new THREE.ShadowMaterial({ opacity: 0.32 }));
floor.receiveShadow = true; scene.add(floor);
// soft contact shadow under the footprint (blurred rounded rectangle), grounds the model on the backdrop
const contact = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.filter = 'blur(26px)'; g.fillStyle = 'rgba(0,0,0,0.78)'; g.beginPath(); g.roundRect(96, 96, 320, 320, 30); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, toneMapped: false })); })();
scene.add(contact);

new GLTFLoader().load('/model.glb', g => {
  const m = g.scene; holder.add(m);
  // CadQuery exports glTF Y-up; rotate back to printer coordinates (Z up) and detect unit scale
  holder.rotation.x = Math.PI / 2; holder.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(holder);
  if (box.getSize(new THREE.Vector3()).x < 5) { holder.scale.setScalar(1000); holder.updateMatrixWorld(true); box = new THREE.Box3().setFromObject(holder); }
  console.log('bbox', JSON.stringify(box.min), JSON.stringify(box.max));
  m.traverse(o => { if (o.isMesh) restyle(o); });
  floor.position.z = box.min.z - 0.5;
  { const sx = box.max.x - box.min.x, sy = box.max.y - box.min.y; contact.scale.set(sx * 1.6, sy * 1.6, 1); contact.position.set((box.min.x + box.max.x) / 2, (box.min.y + box.max.y) / 2, box.min.z - 0.3); }
  window.setView = (pos, tgt, hide, up, fov) => {
    const re = hide ? new RegExp(hide) : null;
    m.traverse(o => { if (o.isMesh) { let vis = true; for (let n = o; n; n = n.parent) if (re && n.name && re.test(n.name)) vis = false; o.visible = vis; } });
    const below = pos[2] < 0;
    floor.visible = contact.visible = !below; under.intensity = below ? 2.2 : 0.0; key.castShadow = true;
    cam.fov = fov || 30; cam.updateProjectionMatrix();
    cam.up.set(...up); cam.position.set(...pos); cam.lookAt(...tgt);

});
