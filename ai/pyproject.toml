[project]
name = "hercules-ai"
version = "1.0.0"
description = "Hercules AI print failure monitor (camera + ML + Klipper/Moonraker)"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "opencv-python-headless>=4.6",
  "onnxruntime>=1.14",
  "requests>=2.25",
  "flask>=2.2",
  "waitress>=2.1",
  "psutil>=5.9",
  "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
datasets = ["remotezip>=0.12"]

[project.scripts]
hercules = "hercules.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hercules"]

[tool.setuptools.package-data]
hercules = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
